name: Publish release images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: ScrumPilot.API/Dockerfile
          - image: web
            dockerfile: ScrumPilot.Web/Dockerfile
          - image: fluentweb
            dockerfile: ScrumPilot.FluentWeb/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set image repository
        id: repository
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.repository.outputs.prefix }}-${{ matrix.image }}:sha-${{ github.sha }}
          provenance: mode=min
      - name: Deployment boundary
        run: |
          echo "Image publication only; no application or database was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy through the reviewed Aspire resource graph with SQL persistence, private parameters, both gateways and backup mapping." >> "$GITHUB_STEP_SUMMARY"
